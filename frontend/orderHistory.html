<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order History</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/orderHistory.css" />
</head>
<body>
  <header class="order-history-topbar">
    <div class="history-header-info">
      <h1>Order History</h1>
      <p>Detailed customer order records</p>
    </div>

    <div class="history-actions">
      <button id="backBtn" class="light" type="button">Back to Customer List</button>
      <button id="logoutBtn" class="secondary" type="button">Logout</button>
    </div>
  </header>

  <main class="order-history-layout">
    <!-- LEFT: ORDERS LIST -->
    <section class="orders-list-panel">
      <div class="content-header">
        <h2>Orders</h2>
        <p id="orderCountInfo" class="info-text">Loading orders...</p>
      </div>

      <div class="order-filter-bar">
        <div class="filter-group">
          <label for="yearFilter">Year</label>
          <select id="yearFilter">
            <option value="">All Years</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="monthFilter">Month</label>
          <select id="monthFilter">
            <option value="">All Months</option>
            <option value="1">January</option>
            <option value="2">February</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div class="filter-actions">
          <button id="applyDateFiltersBtn" type="button">Apply</button>
          <button id="clearDateFiltersBtn" class="secondary" type="button">Clear</button>
        </div>
      </div>

      <div class="order-table-wrapper">
        <table class="orders-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Order Code</th>
              <th>Status</th>
              <th>Created</th>
              <th>Completed</th>
              <th>Items</th>
              <th>Total</th>
            </tr>
          </thead>

          <tbody id="ordersTableBody">
            <tr>
              <td colspan="7" class="table-empty">Loading orders...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- RIGHT: ORDER DETAILS -->
    <aside class="order-detail-panel">
      <div class="detail-panel-header">
        <h2>Order Details</h2>
        <p id="detailPanelInfo">Select an order to view details.</p>
      </div>

      <div id="orderDetailPanel" class="detail-panel-body">
        <div class="empty-message">No order selected.</div>
      </div>
    </aside>
  </main>

  <script type="module" src="./js/pages/OrderHistoryPage.js"></script>
</body>
</html>
