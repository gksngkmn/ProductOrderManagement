<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Order Management</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/login.css" />
</head>
<body>
  <main class="center-page">
    <div class="login-shell">
      <section class="login-brand">
        <h1>Product Order Management</h1>
      </section>

      <section class="card login-card">
        <div class="login-tabs">
          <button id="managerTab" class="active" type="button">Manager</button>
          <button id="customerTab" class="light" type="button">Customer</button>
        </div>

        <div class="login-subtitle">
          <h2 id="loginTitle">Manager Login</h2>
          <p>Enter your credentials to continue.</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password" required />
          </div>

          <button type="submit" id="loginBtn">Login</button>
          <button id="forgotPasswordBtn" class="forgot-password-link" type="button">
            Forgot Password?
          </button>
          <p id="loginMessage" class="login-message"></p>
        </form>
      </section>
    </div>

    <div id="forgotPasswordModal" class="modal-overlay hidden">
  <div class="forgot-password-modal">
    <div class="modal-header">
      <div>
        <h2>Forgot Password</h2>
        <p>Reset your password with a verification code.</p>
      </div>

      <button id="closeForgotPasswordModalBtn" class="secondary" type="button">
        Close
      </button>
    </div>

    <form id="forgotPasswordForm" class="forgot-password-form">
      <div class="form-group">
        <label for="resetIdentifierInput">Username or Email</label>
        <input
          type="text"
          id="resetIdentifierInput"
          placeholder="Enter username or email"
          required
        />
      </div>

      <div class="verification-method-box">
        <h3>Verification Method</h3>

        <label class="verification-option">
          <input type="radio" name="resetMethod" value="email" checked />
          Send verification code by Email
        </label>

        <label class="verification-option">
          <input type="radio" name="resetMethod" value="sms" />
          Send verification code by SMS
        </label>
      </div>

      <div class="forgot-password-actions">
        <button id="requestResetCodeBtn" type="button">
          Request Verification Code
        </button>
      </div>

      <div id="resetPasswordArea" class="reset-password-area hidden">
        <div class="form-group">
          <label for="resetCodeInput">Verification Code</label>
          <input
            type="text"
            id="resetCodeInput"
            placeholder="Enter 6-digit code"
          />
        </div>

        <div class="form-group">
          <label for="newResetPasswordInput">New Password</label>
          <input
            type="password"
            id="newResetPasswordInput"
            placeholder="Enter new password"
          />
        </div>

        <div class="form-group">
          <label for="confirmResetPasswordInput">Confirm Password</label>
          <input
            type="password"
            id="confirmResetPasswordInput"
            placeholder="Confirm new password"
          />
        </div>

        <button id="resetPasswordBtn" type="submit">
          Reset Password
        </button>
      </div>

      <p id="forgotPasswordMessage" class="login-message"></p>
    </form>
  </div>
</div>
  </main>

  <script type="module" src="./js/pages/LoginPage.js"></script>
  <script src="./js/core/I18nManager.js"></script>
</body>
</html>
