<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Order Management | Login</title>
</head>
<body>
  <h1>Product Order Management</h1>

  <div>
    <button id="managerLoginTab">Manager Login</button>
    <button id="customerLoginTab">Customer Login</button>
  </div>

  <form id="loginForm">
    <h2 id="loginTitle">Manager Login</h2>

    <div>
      <label>Username</label>
      <input type="text" id="username" required />
    </div>

    <div>
      <label>Password</label>
      <input type="password" id="password" required />
    </div>

    <button type="submit">Login</button>
  </form>

  <p id="message"></p>

  <script type="module" src="./js/pages/LoginPage.js"></script>
</body>
</html>
