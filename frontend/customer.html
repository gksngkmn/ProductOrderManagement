<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Panel</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/customer.css" />
</head>
<body>
  <!-- TOP HEADER -->
  <header class="customer-topbar">
    <div class="customer-title-area">
      <h1>Customer Panel</h1>
      <p id="customerInfo">Customer information</p>
    </div>

    <div class="customer-top-actions">
      <button id="myOrdersBtn" class="light" type="button">My Order History</button>
      <button id="logoutBtn" class="secondary" type="button">Logout</button>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="customer-layout">
    <!-- LEFT: ADD ITEM -->
    <aside class="customer-sidebar">
      <section class="sidebar-section add-item-section">
        <h2>Add Item</h2>

        <p class="info-text add-item-help">
          Select an existing product suggestion or type product details manually.
        </p>

        <form id="addItemForm" class="add-item-form">
          <input type="hidden" id="selectedProductId" />

          <div class="filter-group">
            <label for="materialInput">Material</label>
            <input
              type="text"
              id="materialInput"
              list="materialOptions"
              placeholder="Material"
              autocomplete="off"
            />
            <datalist id="materialOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="typeInput">Type</label>
            <input
              type="text"
              id="typeInput"
              list="typeOptions"
              placeholder="Type"
              autocomplete="off"
            />
            <datalist id="typeOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="modelInput">Model</label>
            <input
              type="text"
              id="modelInput"
              list="modelOptions"
              placeholder="Model"
              autocomplete="off"
            />
            <datalist id="modelOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="angleInput">Angle</label>
            <input
              type="number"
              id="angleInput"
              list="angleOptions"
              placeholder="Angle"
              step="0.01"
            />
            <datalist id="angleOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="nodalLengthInput">Nodal Length (mm)</label>
            <input
              type="number"
              id="nodalLengthInput"
              list="nodalLengthOptions"
              placeholder="Nodal Length"
              step="0.01"
            />
            <datalist id="nodalLengthOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="widthInput">Width (mm)</label>
            <input
              type="number"
              id="widthInput"
              list="widthOptions"
              placeholder="Width"
              step="0.01"
            />
            <datalist id="widthOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="numberOfTeethInput">Number of Teeth</label>
            <input
              type="number"
              id="numberOfTeethInput"
              list="numberOfTeethOptions"
              placeholder="Number of Teeth"
              min="0"
            />
            <datalist id="numberOfTeethOptions"></datalist>
          </div>

          <div class="filter-group">
            <label for="quantityInput">Quantity</label>
            <input
              type="number"
              id="quantityInput"
              placeholder="Quantity"
              min="1"
              value="1"
            />
          </div>

          <div class="filter-group">
            <label for="unitPriceInput">Unit Price</label>
            <input
              type="number"
              id="unitPriceInput"
              list="unitPriceOptions"
              placeholder="Unit Price"
              step="0.01"
            />
            <datalist id="unitPriceOptions"></datalist>
          </div>

          <div id="selectedProductInfo" class="selected-product-info">
            No product selected yet.
          </div>

          <div class="sidebar-actions">
            <button id="addItemBtn" type="submit">Add Item</button>
            <button id="clearItemFormBtn" class="secondary" type="button">Clear</button>
          </div>
        </form>
      </section>
    </aside>

    <!-- RIGHT: CURRENT ORDER -->
    <section class="customer-content">
<div class="content-header">
  <div>
    <h2>Current Order</h2>
    <p id="currentOrderInfo" class="info-text">No active order loaded.</p>
  </div>

  <div class="content-actions">
    <button id="completeOrderBtn" class="danger" type="button" disabled>Complete</button>
  </div>
</div>

<div id="currentOrderItems" class="order-summary large-order-summary">
  <div class="empty-message">No current order items.</div>
</div>
    </section>
  </main>

  <script type="module" src="./js/pages/CustomerPage.js?v=33"></script>
</body>
</html>
