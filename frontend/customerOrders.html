<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Order History</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/customerOrders.css" />
</head>
<body>
  <header class="customer-orders-topbar">
    <div class="customer-orders-title-area">
      <h1>My Order History</h1>
      <p id="customerInfo">Customer information</p>
    </div>

    <div class="customer-orders-top-actions">
      <button id="backToCustomerBtn" class="light" type="button">
        Back to Customer Panel
      </button>

      <button id="logoutBtn" class="secondary" type="button">
        Logout
      </button>
    </div>
  </header>

  <main class="customer-orders-layout">
    <!-- FILTERS -->
    <section class="orders-filter-bar">
      <div class="filter-group">
        <label for="orderSearchInput">Search</label>
        <input
          type="text"
          id="orderSearchInput"
          placeholder="Search order code or product..."
        />
      </div>

      <div class="filter-group">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="">All</option>
          <option value="Current">Current</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div class="filter-actions">
        <button id="applyOrderFiltersBtn" type="button">Apply</button>
        <button id="clearOrderFiltersBtn" class="secondary" type="button">Clear</button>
      </div>
    </section>

    <!-- ORDERS + DETAILS -->
    <section class="orders-main-grid">
      <!-- LEFT: ORDERS LIST -->
      <section class="orders-list-panel">
        <div class="content-header">
          <div>
            <h2>Orders</h2>
            <p id="orderCountInfo" class="info-text">Loading orders...</p>
          </div>

          <div class="content-actions">
            <button id="exportCustomerOrdersBtn" class="light" type="button">
              Export Orders
            </button>
          </div>
        </div>

        <div class="order-table-wrapper">
          <table class="orders-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Order Code</th>
                <th>Status</th>
                <th>Created</th>
                <th>Completed</th>
                <th>Items</th>
                <th>Total</th>
              </tr>
            </thead>

            <tbody id="ordersTableBody">
              <tr>
                <td colspan="7" class="table-empty">Loading orders...</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="paginationContainer" class="pagination"></div>
      </section>

      <!-- RIGHT: ORDER DETAILS -->
      <aside class="order-detail-panel">
        <div class="detail-panel-header">
          <div>
            <h2>Order Details</h2>
            <p id="detailPanelInfo">Select an order to view details.</p>
          </div>

          <div class="content-actions">
            <button id="exportCustomerOrderDetailsBtn" class="light" type="button">
              Export Details
            </button>
          </div>
        </div>

        <div id="orderDetailPanel" class="detail-panel-body">
          <div class="empty-message">No order selected.</div>
        </div>
      </aside>
    </section>

    <!-- Hidden stats container used by CustomerOrdersPage.js -->
    <div id="orderStatsContainer" style="display: none;"></div>
  </main>

  <script type="module" src="./js/pages/CustomerOrdersPage.js"></script>
</body>
</html>
