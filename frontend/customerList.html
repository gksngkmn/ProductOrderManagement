<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer List</title>

  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/pages/customerList.css" />
</head>
<body>
  <header class="customer-list-topbar">
    <div class="customer-list-title-area">
      <h1>Customer List</h1>
      <p id="managerInfo">Manager information</p>
    </div>

    <div class="customer-list-top-actions">
      <button id="backToManagerBtn" class="light" type="button">Back to Manager Panel</button>
      <button id="logoutBtn" class="secondary" type="button">Logout</button>
    </div>
  </header>

  <main class="customer-list-layout">
    <section class="customer-list-filter-panel">
      <div class="filter-panel-header">
        <h2>Customer Filters</h2>
      </div>

      <div class="customer-filter-row">
        <div class="filter-group customer-search-group">
          <label for="customerSearchInput">Search</label>
          <input
            type="text"
            id="customerSearchInput"
            placeholder="Search company, name, email..."
          />
        </div>

        <div class="filter-group">
          <label for="cityFilter">City</label>
          <select id="cityFilter">
            <option value="">All Cities</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="countryFilter">Country</label>
          <select id="countryFilter">
            <option value="">All Countries</option>
          </select>
        </div>

        <div class="filter-actions customer-filter-actions">
          <button id="applyCustomerFiltersBtn" type="button">Apply</button>
          <button id="clearCustomerFiltersBtn" class="secondary" type="button">Clear</button>
        </div>
      </div>
    </section>

    <section class="customer-list-content">
      <div class="content-header">
        <div>
          <h2>Customers</h2>
          <p id="customerCountInfo" class="info-text">Loading customers...</p>
        </div>
        <div class="content-actions">
          <button id="exportCustomersBtn" class="light" type="button">Export Excel</button>
          <button id="openAddCustomerModalBtn" type="button">Add Customer</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table class="customer-table">
          <thead>
            <tr>
              <th>Company</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Country</th>
              <th>City</th>
              <th>Username</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="customersTableBody">
            <tr>
              <td colspan="8" class="table-empty">Loading customers...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="paginationContainer" class="pagination"></div>
    </section>

    <div id="addCustomerModal" class="modal-overlay hidden">
  <div class="add-customer-modal">
    <div class="modal-header">
      <div>
        <h2>Add Customer</h2>
        <p>Create a new customer and company account.</p>
      </div>

      <button id="closeAddCustomerModalBtn" class="secondary" type="button">Close</button>
    </div>

    <form id="addCustomerForm" class="add-customer-form">
      <div class="form-section-title">Customer Information</div>

      <div class="add-customer-grid">
        <div class="filter-group">
          <label for="addNameInput">Name</label>
          <input type="text" id="addNameInput" required />
        </div>

        <div class="filter-group">
          <label for="addSurnameInput">Surname</label>
          <input type="text" id="addSurnameInput" required />
        </div>

        <div class="filter-group">
          <label for="addEmailInput">Email</label>
          <input type="email" id="addEmailInput" required />
        </div>

        <div class="filter-group">
          <label for="addPhoneInput">Phone</label>
          <input type="text" id="addPhoneInput" required />
        </div>

        <div class="filter-group">
          <label for="addUsernameInput">Username</label>
          <input type="text" id="addUsernameInput" required />
        </div>

        <div class="filter-group">
          <label for="addPasswordInput">Password</label>
          <input type="password" id="addPasswordInput" required />
        </div>
      </div>

      <div class="form-section-title">Company Information</div>

      <div class="add-customer-grid">
        <div class="filter-group">
          <label for="addCompanyNameInput">Company Name</label>
          <input type="text" id="addCompanyNameInput" required />
        </div>

        <div class="filter-group">
          <label for="addCompanyPhoneInput">Company Phone</label>
          <input type="text" id="addCompanyPhoneInput" />
        </div>

        <div class="filter-group full-width">
          <label for="addAddressInput">Address</label>
          <textarea id="addAddressInput" rows="3"></textarea>
        </div>

        <div class="filter-group">
          <label for="addCountryInput">Country</label>
          <input type="text" id="addCountryInput" required />
        </div>

        <div class="filter-group">
          <label for="addCityInput">City</label>
          <input type="text" id="addCityInput" required />
        </div>
      </div>

      <div class="notification-box">
        <h3>Notification Method</h3>

        <label class="notification-option">
          <input type="radio" name="addCustomerNotificationMethod" value="email" checked />
          Send account information by Email
        </label>

        <label class="notification-option">
          <input type="radio" name="addCustomerNotificationMethod" value="sms" />
          Send account information by SMS
        </label>
      </div>

      <p id="addCustomerMessage" class="add-customer-message"></p>

      <div class="modal-actions">
        <button id="createCustomerBtn" type="submit">Create Customer</button>
        <button id="cancelAddCustomerBtn" class="secondary" type="button">Cancel</button>
      </div>
    </form>
  </div>
</div>
  </main>

  <script type="module" src="./js/pages/CustomerListPage.js?v=62"></script>
</body>
</html>
